[package]
name = "vhost-device-vsock"
version = "0.3.0"
authors = ["Harshavardhan Unnibhavi <harshanavkis@gmail.com>", "Stefano Garzarella <sgarzare@redhat.com>"]
description = "A virtio-vsock device using the vhost-user protocol."
repository = "https://github.com/rust-vmm/vhost-device"
readme = "README.md"
keywords = ["vhost", "vsock"]
license = "Apache-2.0 OR BSD-3-Clause"
edition = "2021"

[features]
default = ["backend_vsock"]
backend_vsock = ["vsock", "libc"]
xen = ["vm-memory/xen", "vhost/xen", "vhost-user-backend/xen"]

[dependencies]
byteorder = "1"
clap = { version = "4.5",  features = ["derive"] }
env_logger = "0.11"
log = "0.4"
thiserror = "2.0"
vhost = { git = "https://github.com/uran0sH/vhost", rev = "63c6e95d8b64d48cd8836072819f5ebed4302f66", features = ["vhost-user-backend"] }
vhost-user-backend = { git = "https://github.com/uran0sH/vhost", rev = "63c6e95d8b64d48cd8836072819f5ebed4302f66" }
virtio-bindings = "0.2.5"
virtio-queue = "0.16"
virtio-vsock = "0.10"
vm-memory = "0.16.1"
vmm-sys-util = "0.15"
figment = { version = "0.10.19", features = ["yaml"] }
vsock = { version = "0.5.0", optional = true }
libc = { version = "0.2.174", optional = true }
serde = { version = "1", features = ["derive"] }
mio = { version = "1.0.4", features = ["os-poll", "os-ext"] }

[dev-dependencies]
assert_matches = "1.5"
virtio-queue = { version = "0.16", features = ["test-utils"] }
tempfile = "3.20.0"

[lints]
workspace = true
